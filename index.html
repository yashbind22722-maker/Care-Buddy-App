<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Buddy Pro</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [medicines, setMedicines] = useState(() => {
                const saved = localStorage.getItem("meds");
                return saved ? JSON.parse(saved) : [];
            });
            const [input, setInput] = useState("");
            const [time, setTime] = useState("");

            useEffect(() => {
                localStorage.setItem("meds", JSON.stringify(medicines));
            }, [medicines]);

            const playSound = () => {
                const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
                audio.play().catch(e => console.log("Sound enabled after interaction"));
            };

            useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    const currentTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    
                    medicines.forEach(med => {
                        if (med.time === currentTime && !med.notified) {
                            playSound();
                            alert(`🚨 ALARM: ${med.name} khane ka waqt ho gaya!`);
                            setMedicines(prev => prev.map(m => m.id === med.id ? {...m, notified: true} : m));
                        }
                    });
                }, 1000);
                return () => clearInterval(interval);
            }, [medicines]);

            const addMedicine = () => {
                if (input && time) {
                    setMedicines([...medicines, { id: Date.now(), name: input, time: time, taken: false, notified: false }]);
                    setInput(""); setTime("");
                }
            };

            const deleteMed = (id) => setMedicines(medicines.filter(m => m.id !== id));
            const toggleTaken = (id) => setMedicines(medicines.map(m => m.id === id ? {...m, taken: !m.taken} : m));
            const progress = medicines.length > 0 ? Math.round((medicines.filter(m => m.taken).length / medicines.length) * 100) : 0;

            return (
                <div className="flex flex-col items-center p-4 min-h-screen">
                    <header className="w-full max-w-md bg-blue-600 text-white p-6 rounded-2xl shadow-lg mb-6 text-center">
                        <h1 className="text-2xl font-bold">Care Buddy Pro</h1>
                        <p className="text-sm opacity-90">Sound & Memory Active 🚀</p>
                    </header>
                    <main className="w-full max-w-md bg-white p-6 rounded-3xl shadow-xl">
                        <div className="mb-6 bg-blue-50 p-4 rounded-2xl">
                            <h2 className="font-bold text-blue-800 text-center">Target: {progress}%</h2>
                            <div className="w-full bg-gray-200 h-3 rounded-full mt-2 overflow-hidden">
                                <div className="bg-green-500 h-full transition-all" style={{width: `${progress}%`}}></div>
                            </div>
                        </div>
                        <div className="space-y-3 mb-6">
                            <input type="text" value={input} onChange={(e)=>setInput(e.target.value)} placeholder="Medicine ka naam..." className="w-full border p-3 rounded-xl outline-none focus:border-blue-500" />
                            <div className="flex gap-2">
                                <input type="time" value={time} onChange={(e)=>setTime(e.target.value)} className="flex-1 border p-3 rounded-xl outline-none" />
                                <button onClick={addMedicine} className="bg-blue-600 text-white px-6 rounded-xl font-bold">Add</button>
                            </div>
                        </div>
                        <div className="space-y-3">
                            {medicines.map(med => (
                                <div key={med.id} className="flex items-center justify-between p-4 bg-gray-50 rounded-2xl border">
                                    <div className="flex items-center gap-3">
                                        <input type="checkbox" checked={med.taken} onChange={() => toggleTaken(med.id)} className="w-5 h-5" />
                                        <div>
                                            <p className={`font-bold ${med.taken ? 'line-through text-gray-300' : ''}`}>{med.name}</p>
                                            <p className="text-xs text-blue-500">⏰ {med.time}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => deleteMed(med.id)} className="text-red-400 text-sm">Delete</button>
                                </div>
                            ))}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
